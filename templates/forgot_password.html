{% extends "base.html" %}{% block title %}Forgot password | OneCre8{% endblock %}{% block content %}
<section class="section auth-section"><div class="auth-card"><p class="eyebrow">ACCOUNT SECURITY</p><h1>Reset your password</h1><p class="muted">Enter the email address linked to your OneCre8 account. If it exists, we'll send a secure reset link.</p>
<form method="POST" class="booking-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email address<input type="email" name="email" required autocomplete="email"></label><button class="btn dark full" type="submit">Send reset link</button></form><p class="auth-switch"><a href="{{ url_for('login') }}">Back to login</a></p></div></section>{% endblock %}

{% extends "base.html" %}
{% block title %}Log in | OneCre8 Media{% endblock %}
{% block content %}<section class="section auth-section"><div class="auth-card">
<p class="eyebrow">WELCOME BACK</p><h1>Log in to OneCre8</h1><p class="muted">Access your bookings and account.</p>
{% if google_enabled %}<a class="btn btn-secondary full" href="{{ url_for('google_login') }}">Continue with Google</a><div class="auth-divider"></div>{% endif %}
<form method="POST" class="booking-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Email address<input type="email" name="email" required placeholder="you@example.com"></label>
<label>Password<input type="password" name="password" required placeholder="Your password"></label>
<button class="btn dark full" type="submit">Log in</button></form>
<p class="auth-switch">Don't have an account? <a href="{{ url_for('register') }}">Create one</a></p>
</div></section>{% endblock %}

name: Python application checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile app.py
      - name: Validate Jinja templates
        run: python -c "from pathlib import Path; from jinja2 import Environment; [Environment().parse(p.read_text()) for p in Path('templates').glob('*.html')]; print('All Jinja templates parse successfully')"

      - name: Run application regression tests
        run: python -m unittest discover -s tests -v

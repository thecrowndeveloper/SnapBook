name: Generate optimized WebP images

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-webp-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  convert-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the triggering branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image converter
        run: python -m pip install --upgrade Pillow

      - name: Convert JPEGs to WebP
        run: python scripts/optimize_category_images.py

      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/images/photo1.webp static/images/categories/One-Cre8-Media/*.webp
          if git diff --cached --quiet; then
            echo "WebP images are already up to date."
          else
            git commit -m "Add optimized WebP image assets"
            git push origin "${GITHUB_REF_NAME}"
          fi
